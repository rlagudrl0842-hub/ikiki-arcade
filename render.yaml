# Render 배포 설정 — 모든 파일이 저장소 최상위에 있는 구조
services:
  - type: web
    name: ikiki-arcade
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: node --no-warnings --experimental-sqlite server.js
    healthCheckPath: /api/games
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: DB_FILE
        value: /var/data/arcade.db
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: arcade-data
      mountPath: /var/data
      sizeGB: 1
